version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: echo_user
      POSTGRES_PASSWORD: echo_password
      POSTGRES_DB: echo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - echo-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - echo-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://echo_user:echo_password@postgres:5432/echo_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    networks:
      - echo-network

volumes:
  postgres_data:

networks:
  echo-network:
    driver: bridge
