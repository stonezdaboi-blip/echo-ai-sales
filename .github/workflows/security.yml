name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if SNYK_TOKEN is available
        id: snyk-check
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Snyk Security Scan
        if: steps.snyk-check.outputs.available == 'true'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Report missing Snyk credentials
        if: steps.snyk-check.outputs.available == 'false'
        run: |
          echo "::warning::SNYK_TOKEN is not configured. Snyk scan was skipped."

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Warn if Trivy report is missing
        if: always() && hashFiles('trivy-results.sarif') == ''
        run: |
          echo "::warning::Trivy did not produce a SARIF report. Check the scan step."

  dependency-check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [backend, mobile]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify lockfile
        working-directory: ./${{ matrix.project }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::${{ matrix.project }}/package-lock.json is missing."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ./${{ matrix.project }}
        run: npm ci

      - name: Audit dependencies
        working-directory: ./${{ matrix.project }}
        run: npm audit --audit-level=moderate
