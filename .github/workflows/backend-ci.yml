name: ECHO Backend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate lockfile if missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Commit generated lockfile
        if: github.event_name == 'push'
        working-directory: .
        run: |
          if [ -f backend/package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add backend/package-lock.json

            if ! git diff --cached --quiet; then
              git commit -m "chore: add backend package lockfile"
              git push
            fi
          fi

      - name: Verify lockfile exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: backend/package-lock.json was not created."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand
